<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Contact · Bubo4400</title>
<style>
  :root { --bg: #0d1117; --fg: #c9d1d9; --dim: #8b949e; --accent: #58a6ff; --box: #161b22; --line: #30363d; --hl: #1f2937; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #ffffff; --fg: #1f2328; --dim: #59636e; --accent: #0969da; --box: #f6f8fa; --line: #d1d9e0; --hl: #eaeef2; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--fg);
         font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  main { width: 100%; max-width: 560px; background: var(--box); border: 1px solid var(--line);
         border-radius: 8px; padding: 24px; }
  .prompt { color: var(--dim); margin: 0 0 16px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid var(--line); scroll-margin-top: 24px; }
  li:first-child { border-top: 0; }
  .c { display: grid; grid-template-columns: 7.5em 1fr auto; align-items: center; gap: 12px;
       padding: 10px 12px; border-radius: 6px; color: var(--fg); text-decoration: none;
       transition: background .2s; }
  .c:hover, .c:focus-visible, li:target .c { background: var(--hl); }
  .c:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .label { color: var(--dim); min-width: 0; word-break: break-all; }
  .c:hover .label, .c:focus-visible .label { color: var(--accent); }
  .arrow { color: var(--dim); }
  a { color: var(--accent); }
  .note { color: var(--dim); font-size: 13px; margin: 16px 0 0; }
  .back { display: inline-block; margin-top: 12px; color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<main>
  <p class="prompt">bubo4400@dusk ~ $ ls contact/</p>
  <ul>
    <li id="mail"><a class="c" href="#mail" data-k="mail"><span>🗁 mail/</span><span class="label">Send me an email</span><span class="arrow">↗</span></a></li>
    <li id="linkedin"><a class="c" href="#linkedin" data-k="linkedin"><span>🗁 linkedin/</span><span class="label">Zachary Coates</span><span class="arrow">↗</span></a></li>
    <li id="youtube"><a class="c" href="#youtube" data-k="youtube"><span>🗁 youtube/</span><span class="label">@Bubo4400</span><span class="arrow">↗</span></a></li>
    <li id="discord"><a class="c" href="#discord" data-k="discord"><span>🗁 discord/</span><span class="label">Message me on Discord</span><span class="arrow">↗</span></a></li>
  </ul>
  <p class="note">Links are only put together when you click, which keeps them away from spam bots.</p>
  <a class="back" href="https://github.com/Bubo4400">← back to GitHub</a>
</main>
<script>
  var C = {
    mail: [125,102,100,111,51,100,104,102,115,98,116,71,96,106,102,110,107,41,100,104,106],
    linkedin: [111,115,115,119,116,61,40,40,112,112,112,41,107,110,105,108,98,99,110,105,41,100,104,106,40,110,105,40,125,102,100,111,102,117,126,42,100,104,102,115,98,116,42,53,49,102,49,51,50,51,54,55],
    youtube: [111,115,115,119,116,61,40,40,112,112,112,41,126,104,114,115,114,101,98,41,100,104,106,40,71,69,114,101,104,51,51,55,55],
    discord: [111,115,115,119,116,61,40,40,99,110,116,100,104,117,99,41,100,104,106,40,114,116,98,117,116,40,54,54,62,63,55,53,49,63,62,52,54,48,63,51,50,63,53,55,52]
  };
  function decode(c) { return String.fromCharCode.apply(null, c.map(function (n) { return n ^ 7; })); }
  document.querySelectorAll('a[data-k]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var k = a.dataset.k, v = decode(C[k]);
      if (k === 'mail') {
        // Open the mail app, and show the address too for people who use webmail.
        a.querySelector('.label').textContent = v;
        window.location.href = 'mailto:' + v;
      } else {
        window.open(v, '_blank', 'noopener');
      }
    });
  });

  // Arriving from a README link (#mail, #linkedin, ...) opens that contact straight away.
  var k = location.hash.slice(1);
  if (C[k]) {
    var v = decode(C[k]);
    if (k === 'mail') {
      document.querySelector('#mail .label').textContent = v;
      window.location.href = 'mailto:' + v;
    } else {
      location.replace(v);
    }
  }
</script>
</body>
</html>
